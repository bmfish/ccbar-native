server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cc-service
  flyway:
    baseline-on-migrate: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cc_service}
    username: ${DB_USER:cc}
    password: ${DB_PASSWORD:cc_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000

app:
  # 留空则关闭鉴权（仅限本地开发）
  api-token: ${API_TOKEN:}
  admin:
    # 管理员账号登录；password-hash 使用 pbkdf2$iterations$salt$digest 格式
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:90}
    delete-batch-size: ${AUDIT_DELETE_BATCH_SIZE:5000}
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
  push:
    # 久坐提醒定时检查间隔（毫秒）
    check-interval-ms: ${PUSH_CHECK_INTERVAL_MS:30000}
  travel:
    # 12306 邮件同步（高铁笔记移植）；enabled=false 时不做任何同步
    enabled: ${TRAVEL_SYNC_ENABLED:false}
    # 定时检查间隔（毫秒），实际同步受 min-interval-minutes 节流
    check-interval-ms: ${TRAVEL_CHECK_INTERVAL_MS:1800000}
    # 距上次成功同步不足该分钟数则跳过自动同步
    min-interval-minutes: ${TRAVEL_MIN_INTERVAL_MINUTES:30}
    mail:
      # QQ 邮箱 IMAP；填 127.0.0.1 或 8025 端口时自动走明文（联调用 scripts/mock_imap.py）
      host: ${TRAVEL_MAIL_HOST:imap.qq.com}
      port: ${TRAVEL_MAIL_PORT:993}
      email: ${TRAVEL_MAIL_EMAIL:}
      # QQ 邮箱授权码（16 位，非登录密码），只走环境变量不落库
      auth-code: ${TRAVEL_MAIL_AUTH_CODE:}
      # 乘车人姓名，只导入本人车票
      owner: ${TRAVEL_MAIL_OWNER:}
    fetch:
      # 每批 FETCH 的邮件数与单批超时（毫秒），照搬 iOS 端参数
      batch-size: ${TRAVEL_FETCH_BATCH_SIZE:20}
      timeout-ms: ${TRAVEL_FETCH_TIMEOUT_MS:90000}

logging:
  level:
    root: INFO
