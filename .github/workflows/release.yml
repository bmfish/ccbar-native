name: Release

# push v* tag 时自动构建 universal DMG 并发布 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & package
        run: bash scripts/package.sh "${GITHUB_REF_NAME#v}" --universal

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CCBar-*.dmg
