name: Release

# push v* tag 时自动构建 DMG 并发布 GitHub Release
# universal 优先（arm64 + x86_64），构建失败时回退 arm64
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & package
        run: |
          if ! bash scripts/package.sh "${GITHUB_REF_NAME#v}" --universal; then
            echo "::warning::universal 构建失败，回退 arm64"
            bash scripts/package.sh "${GITHUB_REF_NAME#v}"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CCBar-*.dmg
